<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR 참여</title>
<style>
:root{--bg:#F3F5F9;--card:#FFF;--ink:#1E2329;--sub:#6B7480;--muted:#9AA3AF;--line:#E7EAF0;--blue:#3D8BFD;--blue-soft:#EAF2FF;--mint:#34C38F;--mint-soft:#E6F7F0;--yellow:#F5B83D;--yellow-soft:#FFF6E0;--purple:#9B7BEA;--purple-soft:#F2EDFD;--slate:#64748B;--slate-soft:#EEF1F5;--pink:#F0679A;--pink-soft:#FDEBF2;--bad:#E5534B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.01em;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;min-width:0}
.brand i{flex:none;width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar nav{display:flex;gap:6px;flex:none}
.bar nav a,.bar nav button{border:0;background:var(--slate-soft);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
h3{font-size:15px;margin:0 0 8px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#F7F8FA;font:inherit;font-size:16px;margin-bottom:12px;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);border-radius:11px;padding:9px 0;background:#F7F8FA;font:inherit;font-size:14px;color:var(--ink)}
.seg button.on{border-color:var(--ink);background:var(--card);font-weight:700}
.consent{display:flex;gap:8px;font-size:12.5px;color:var(--sub);align-items:flex-start;margin:4px 0 12px;font-weight:400}
.consent input{width:auto;margin:3px 0 0}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
.scan{display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;padding:16px;margin-bottom:12px;background:var(--ink)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:13px;display:block;margin:12px auto 0}
.err{color:var(--bad);font-size:13px;min-height:1em;margin:0 0 8px}
.hello{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);margin-left:6px}
.hint{color:var(--sub);font-size:13px;margin:0}
.load{text-align:center;color:var(--muted);padding:60px 0}
/* 지금 찍은 QR */
.spot{border-radius:18px;padding:14px 16px;margin-bottom:10px;background:var(--card);border:2px solid var(--line)}
.spot .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spot .id{background:var(--ink);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px}
.spot b{font-size:18px}
.spot p{margin:6px 0 0;font-size:13.5px;color:var(--sub)}
.mod{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;color:#fff}
.mod.보물{background:var(--yellow);color:#4A3500}.mod.퀴즈{background:var(--purple)}.mod.코스{background:var(--mint)}.mod.안내{background:var(--slate)}
.spot.보물{border-color:#F8D98C}.spot.퀴즈{border-color:#D5C6F6}.spot.코스{border-color:#A9E5CC}.spot.안내{border-color:#D3DAE4}
.lead{font-size:12px;font-weight:700;color:var(--muted);margin:4px 2px 6px}
/* 결과 */
.result{border-radius:18px;padding:18px;margin-bottom:12px;text-align:center}
.result .f{font-size:38px;display:block;line-height:1}
.result b{display:block;font-size:20px;margin-top:6px}
.result p{margin:4px 0 0;font-size:14px}
.hit{background:var(--yellow-soft)}.miss,.hour,.day,.note,.ans{background:var(--card)}.dup{background:var(--purple-soft)}.full{background:var(--mint-soft)}
.quiz{background:var(--purple-soft)}.stamp,.done{background:var(--mint-soft)}.info{background:var(--card);text-align:left}
.info b{font-size:17px}.info p{white-space:pre-line;word-break:break-word}.info a{color:var(--blue);font-weight:600}
@media (prefers-reduced-motion:no-preference){.fresh{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.opts{display:grid;gap:8px;margin:-4px 0 12px}
.opts button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font:inherit;font-size:15px;text-align:left;color:var(--ink)}
.opts button:disabled{opacity:.6}
.opts .ok{border-color:var(--mint);background:var(--mint-soft);font-weight:700;opacity:1}
.opts .ng{border-color:var(--bad);background:#FDECEB;opacity:1}
/* 점수 */
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.score div{background:var(--card);border-radius:16px;padding:12px 14px}
.score b{display:block;font-size:28px;line-height:1.1;font-weight:800;color:#3A4250}
.score span{font-size:12px;color:var(--sub)}
/* 코스 지도 */
.route{border-radius:14px;overflow:hidden;background:#FAFBFD;margin:8px 0 10px;border:1px solid var(--line)}
.route svg{display:block;width:100%;height:auto}
.prog{height:8px;background:var(--slate-soft);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--mint)}
.stops{display:grid;gap:6px}
.stops div{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 10px;border-radius:12px;background:#F7F8FA}
.stops div.got{background:var(--mint-soft)}
.stops div.next{background:var(--blue-soft);font-weight:700}
.stops em{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;background:#fff;border:2px solid var(--blue);color:var(--blue)}
.stops .got em{background:var(--mint);border-color:var(--mint);color:#fff}
.stops small{margin-left:auto;color:var(--sub);font-size:12px}
/* 메뉴 */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.menu a{display:block;background:var(--card);border-radius:16px;padding:14px;text-decoration:none}
.menu a b{display:block;font-size:15px;margin-top:6px}
.menu a span{font-size:12px;color:var(--sub)}
.menu i{font-style:normal;font-size:22px}
.r{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}.r.mine{font-weight:700}
.kakao{display:block;background:#FEE500;color:#191600;border-radius:16px;padding:15px 16px;margin-bottom:12px;text-decoration:none}
.kakao b{display:block;font-size:16px;margin-bottom:3px}
.kakao p{margin:0 0 10px;font-size:13.5px;line-height:1.45;color:#3C3500}
.kakao span{display:block;text-align:center;background:#191600;color:#FEE500;border-radius:11px;padding:11px;font-weight:700;font-size:15px}
.kakao.mini{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:14px;font-weight:700}
.kakao.mini span{display:inline;background:none;color:#191600;padding:0;font-size:14px}
#cam{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column;overflow:hidden;touch-action:none}
#cam.on{display:flex}
#cam video{flex:1;width:100%;min-height:0;object-fit:cover;transform-origin:50% 50%;transition:transform .12s}
#cam .zoombar{position:absolute;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);border-radius:14px;padding:8px 10px}
#cam .zoombar button{min-width:46px;height:40px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:10px;font:inherit;font-size:15px;font-weight:700}
#cam .zoombar button.on{background:#fff;color:#1F2B24;border-color:#fff}
#cam .zoombar input{flex:1;min-width:0;margin:0;padding:0;border:0;background:none;accent-color:#E3AC14;height:40px}
#cam .zoombar .zv{color:#fff;font-weight:700;font-size:14px;min-width:38px;text-align:right}
#cam .frame{position:absolute;left:50%;top:45%;width:min(68vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
#cam .msg{position:absolute;left:0;right:0;top:calc(45% + min(34vw,150px) + 20px);text-align:center;color:#fff;font-size:15px;padding:0 20px}
#cam .close{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));border:0;border-radius:13px;padding:14px;font:inherit;font-weight:700;background:#fff;color:#1F2B24}
@media (max-height:680px){#cam .frame{top:38%;width:min(68vw,300px,46vh)}#cam .msg{margin:0;top:calc(38% + min(34vw,150px,23vh) + 14px)}}
</style>
</head>
<body>
<header class="bar"><div class="brand"><i>Q</i><span id="ttl">QR 참여</span></div><nav><a href="portal.html" id="portal">포털</a><button type="button" id="home">홈</button></nav></header>
<div class="wrap" id="app"><div class="load">불러오는 중이에요</div></div>
<div id="cam" aria-modal="true" role="dialog" aria-label="QR 찍기">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <p class="msg" id="cammsg">QR을 네모 안에 맞춰 주세요</p>
  <div class="zoombar" id="zoombar">
    <button type="button" data-z="1">1×</button><button type="button" data-z="2">2×</button><button type="button" data-z="3">3×</button>
    <input type="range" id="zoom" min="1" max="4" step="0.1" value="1" aria-label="카메라 확대">
    <span class="zv" id="zv">1.0×</span>
  </div>
  <button class="close" id="camclose" type="button">닫기</button>
</div>
<script src="config.js"></script>
<script>
/* 서버 주소는 config.js 한 곳에서 관리. ?s=fest 이면 축제(시뮬레이션) 서버, 없으면 시범운영 서버 (이미 붙인 QR 호환) */
var SRV = (new URLSearchParams(location.search).get('s') || 'pilot').replace(/[^a-z]/g,'');
var SERVERS = window.QR_SERVERS || {};
if(!SERVERS[SRV]) SRV = 'pilot';
var API_URL = (SERVERS[SRV] && SERVERS[SRV].url) || '여기에';
var SQ = SRV === 'pilot' ? '' : '?s=' + SRV;
var KEY = SRV === 'pilot' ? 'qrhunt-token' : 'qrhunt-token-' + SRV;
document.getElementById('portal').href = 'portal.html' + (SRV === 'pilot' ? '?s=pilot' : SQ);
/* 오픈채팅은 시범운영에서만 */
var KAKAO = SRV === 'pilot' ? 'https://open.kakao.com/o/gEHbrsTi' : '';
function kakaoSeen(){ try{ return localStorage.getItem('qrhunt-kakao') === '1'; }catch(e){ return false; } }
function kakaoBox(mini){
  if(!KAKAO) return '';
  var a = '<a class="kakao'+(mini?' mini':'')+'" href="'+KAKAO+'" target="_blank" rel="noopener" onclick="try{localStorage.setItem(\'qrhunt-kakao\',\'1\')}catch(e){}">';
  if(mini) return a+'💬 오픈채팅 공지방<span>바로가기 →</span></a>';
  return a+'<b>💬 오픈채팅방에 꼭 들어와 주세요</b><p>중간 순위 공개, 당첨자 발표, 시상 안내, 운영 공지는 모두 오픈채팅방에서 해요.</p><span>오픈채팅 바로 들어가기 →</span></a>';
}
var app = document.getElementById('app');
var info = null, team = null, mode = 'join', last = null, plan = null;
var OUT = /KAKAOTALK/i.test(navigator.userAgent);
if(OUT){ location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); }
var QR = cleanQr(new URLSearchParams(location.search).get('qr'));
if (QR) history.replaceState(null, '', location.pathname + SQ);

function cleanQr(s){ return String(s || '').replace(/[^A-Za-z0-9\-]/g, '').slice(0, 12); }
function getTok(){ try{ return localStorage.getItem(KEY); }catch(e){ return window._tok || null; } }
function setTok(t){ try{ if(t) localStorage.setItem(KEY,t); else localStorage.removeItem(KEY); }catch(e){} window._tok = t; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function val(id){ return document.getElementById(id).value.trim(); }

/* 서버 호출: 25초 넘게 응답이 없으면 실패로 처리 */
function call(fn, args, ok, fail){
  var url = API_URL + '?api=' + fn + '&a=' + encodeURIComponent(JSON.stringify(args)) + '&_=' + Date.now();
  var ctl = window.AbortController ? new AbortController() : null, done = false;
  var timer = setTimeout(function(){ if(ctl) ctl.abort(); onFail(); }, 25000);
  function onFail(){
    if(done) return; done = true; clearTimeout(timer);
    if(fail) return fail();
    var b = document.getElementById('go'); if(b){ b.disabled = false; }
    if(!b || !document.getElementById('err')){
      app.innerHTML = '<div class="card"><p class="err">연결이 잠깐 끊겼어요.</p><p class="hint">사람이 몰리면 서버 응답이 늦어질 수 있어요.</p><button class="btn" id="retry" style="margin-top:12px">다시 불러오기</button></div>';
      document.getElementById('retry').onclick = function(){ app.innerHTML = '<div class="load">불러오는 중이에요</div>'; if(!info) start(); else if(getTok()) refresh(); else renderAuth(); };
    } else document.getElementById('err').textContent = '연결이 잠깐 끊겼어요. 다시 눌러 주세요.';
  }
  fetch(url, ctl ? { redirect: 'follow', signal: ctl.signal } : { redirect: 'follow' })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(done) return; done = true; clearTimeout(timer); ok(j); })
    .catch(onFail);
}
/* 도면 비율을 알아야 코스 지도가 찌그러지지 않음 */
function loadPlan(cb){
  if(!info || !info.plan || info.geo === '위경도') return cb();
  if(plan) return cb();
  var im = new Image();
  im.onload = function(){ plan = { src: info.plan, w: im.naturalWidth, h: im.naturalHeight }; cb(); };
  im.onerror = function(){ plan = null; cb(); };
  im.src = info.plan;
}
function start(){
  call('getInfo', [QR], function(i){
    info = i; team = i.teams[0];
    if(i.title){ document.title = i.title; document.getElementById('ttl').textContent = i.title; }
    loadPlan(function(){
      var t = getTok();
      if(!t) return renderAuth();
      if(QR) doScan(QR); else refresh();
    });
  });
}
function refresh(){
  call('myStatus',[getTok()],function(r){
    if(r && r.error === 'login'){ setTok(null); return renderAuth(); }
    if(r && r.error){ app.innerHTML = '<div class="card"><p class="err">'+esc(r.error)+'</p><p class="hint">잠시 뒤 홈을 눌러 주세요.</p></div>'; return; }
    renderStatus(r);
  });
}
function doScan(q, retry){
  QR = '';
  app.innerHTML = '<div class="load">'+esc(q)+' 확인 중이에요'+(retry ? '<br><span class="hint">응답이 늦어 한 번 더 확인하고 있어요</span>' : '<br><span class="hint">사람이 많으면 몇 초 걸릴 수 있어요</span>')+'</div>';
  call('scan',[getTok(),q],function(r){
    if(r && !r.error){
      var res = r.result;
      if(retry && res === '중복') res = '발견';
      if(retry && res === '재방문') res = '스탬프';
      last = {result:res, qr:r.qr, cap:r.cap, quiz:r.quiz, course:r.course, info:r.info, spot:r.spot, fresh:true};
    }
    handle(r);
  }, function(){
    if(!retry) return setTimeout(function(){ doScan(q, true); }, 1500);
    last = {note:'결과를 받는 중에 연결이 끊겼어요', sub:'찍은 기록은 서버에 남았을 수 있어요. 아래 내 점수를 확인하고, 안 올랐으면 같은 QR을 다시 찍어 주세요. 두 번 세지는 않아요.', fresh:true};
    app.innerHTML = '<div class="load">내 기록 불러오는 중이에요</div>';
    refresh();
  });
}
function doAnswer(q, choice){
  var spot = last && last.spot;
  app.innerHTML = '<div class="load">정답 확인 중이에요</div>';
  call('answer',[getTok(),q,choice],function(r){
    if(r && r.error === 'login'){ setTok(null); return renderAuth(); }
    if(r && r.error){ last = {note:r.error, sub:'아래 점수를 확인해 주세요.', fresh:true}; return refresh(); }
    last = {result:r.result, qr:r.qr, quiz:r.quiz, spot:r.spot || spot, fresh:true};
    renderStatus(r);
  }, function(){
    last = {note:'정답을 확인하는 중에 연결이 끊겼어요', sub:'답은 기록됐을 수 있어요. 같은 QR을 다시 찍으면 결과를 볼 수 있어요.', fresh:true};
    refresh();
  });
}
function handle(r){
  if(r && r.error === 'login'){ setTok(null); return renderAuth(); }
  if(r && r.error){ last = {note:r.error, fresh:true}; return refresh(); }
  renderStatus(r);
}

/* ---------- 이 QR 카드 ---------- */
function spotCard(sp, lead){
  if(!sp) return '';
  return (lead ? '<div class="lead">'+esc(lead)+'</div>' : '')+
    '<div class="spot '+esc(sp.mod)+'"><div class="top"><span class="id">'+esc(sp.id)+'</span><b>'+esc(sp.loc)+'</b><span class="mod '+esc(sp.mod)+'">'+esc(sp.mod)+(sp.mod==='코스' && sp.step ? ' '+sp.step+'/'+sp.total : '')+'</span></div><p>'+esc(sp.what)+'</p></div>';
}

/* ---------- 참가 / 로그인 ---------- */
function renderAuth(){
  var sp = info.spot && QR ? info.spot : null;
  var head = '';
  if(sp) head += spotCard(sp, '📍 지금 찍은 QR') + '<p class="hint" style="margin:0 2px 14px">'+(mode==='login'?'로그인':'참가')+'하면 이 QR이 바로 찍혀요.</p>';
  head += '<h1>'+(mode==='login'?'로그인':'참가하기')+'</h1><p class="sub">'+info.days+'일 동안 '+hourText(info.open)+'부터 '+hourText(info.close)+'까지. '+modsText()+'</p>';
  if(mode === 'login'){
    app.innerHTML = head + '<div class="card"><label for="n">닉네임</label><input id="n" autocomplete="off">'+
      '<label for="p">내 번호 4자리</label><input id="p" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="참가할 때 정한 번호">'+
      '<p class="err" id="err"></p><button class="btn" id="go">로그인</button>'+
      '<button class="link" id="sw">처음이면 참가하기</button></div>' + kakaoBox(true);
    document.getElementById('go').onclick = function(){ var b=this; b.disabled=true; call('resume',[val('n'),val('p')],afterAuth(b)); };
  } else {
    app.innerHTML = head + '<div class="card"><label for="n">닉네임</label><input id="n" maxlength="12" autocomplete="off" placeholder="순위표에 보여요 (실명·학번은 적지 마세요)">'+
      '<label>소속</label><div class="seg" id="seg">'+info.teams.map(function(t){return '<button type="button" data-t="'+esc(t)+'" class="'+(t===team?'on':'')+'">'+esc(t)+'</button>';}).join('')+'</div>'+
      '<label for="p">내 번호 4자리</label><input id="p" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="다른 폰에서 로그인할 때 써요">'+

/* ---------- 코스 루트 지도: 거점을 순서대로 잇고, 찍은 곳은 채움 ---------- */
function routeSvg(c, here){
  var pts = c.list.filter(function(s){ return s.x != null && s.y != null && s.x !== '' && s.y !== ''; });
  if(!plan || pts.length < 2) return '';
  var H = 100 * plan.h / plan.w;
  var xs = pts.map(function(s){ return +s.x; }), ys = pts.map(function(s){ return +s.y * H / 100; });
  var pad = 7, x0 = Math.max(0, Math.min.apply(null, xs) - pad), x1 = Math.min(100, Math.max.apply(null, xs) + pad);
  var y0 = Math.max(0, Math.min.apply(null, ys) - pad), y1 = Math.min(H, Math.max.apply(null, ys) + pad);
  var w = x1 - x0, h = y1 - y0;
  if(h < w * 0.55){ var add = (w * 0.55 - h) / 2; y0 = Math.max(0, y0 - add); h = Math.min(H - y0, w * 0.55); }   /* 너무 납작하지 않게 */
  var k = w / 60, s = '<svg viewBox="'+x0.toFixed(2)+' '+y0.toFixed(2)+' '+w.toFixed(2)+' '+h.toFixed(2)+'" xmlns="http://www.w3.org/2000/svg">';
  s += '<image href="'+esc(plan.src)+'" x="0" y="0" width="100" height="'+H.toFixed(2)+'" preserveAspectRatio="none"/>';
  var P = pts.map(function(p){ return [+p.x, +p.y * H / 100]; });
  s += '<polyline points="'+P.map(function(p){ return p.join(','); }).join(' ')+'" fill="none" stroke="#3D8BFD" stroke-width="'+(0.9*k).toFixed(2)+'" stroke-dasharray="'+(1.6*k).toFixed(2)+' '+(1.1*k).toFixed(2)+'" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>';
  for(var i = 1; i < pts.length; i++) if(pts[i].got && pts[i-1].got)
    s += '<line x1="'+P[i-1][0]+'" y1="'+P[i-1][1]+'" x2="'+P[i][0]+'" y2="'+P[i][1]+'" stroke="#34C38F" stroke-width="'+(1.3*k).toFixed(2)+'" stroke-linecap="round"/>';
  pts.forEach(function(p, i){
    var cx = P[i][0], cy = P[i][1], r = 2.3 * k, isHere = p.id === here;
    if(isHere) s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*1.75).toFixed(2)+'" fill="#3D8BFD" opacity=".18"/>';
    s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(2)+'" fill="'+(p.got ? '#34C38F' : '#fff')+'" stroke="'+(p.got ? '#fff' : '#3D8BFD')+'" stroke-width="'+(0.6*k).toFixed(2)+'"/>';
    s += '<text x="'+cx+'" y="'+(cy + 1.0*k)+'" text-anchor="middle" font-size="'+(2.6*k).toFixed(2)+'" font-weight="800" fill="'+(p.got ? '#fff' : '#3D8BFD')+'">'+(p.got ? '✓' : (i+1))+'</text>';
    s += '<text x="'+cx+'" y="'+(cy - r - 1.1*k)+'" text-anchor="middle" font-size="'+(2.2*k).toFixed(2)+'" font-weight="700" fill="#1E2329" paint-order="stroke" stroke="#fff" stroke-width="'+(0.8*k).toFixed(2)+'">'+esc(p.loc)+'</text>';
  });
  return '<div class="route">' + s + '</svg></div>';
}
function courseCards(r, here){
  if(!r.courses || !r.courses.length) return '';
  return r.courses.map(function(c){
    var next = -1; c.list.some(function(s, i){ if(!s.got){ next = i; return true; } return false; });
    return '<div class="card"><h3>🗺️ '+esc(c.name)+' <span class="chip">'+(c.done ? '완주 🏁' : c.got+'/'+c.total)+'</span></h3>'+

      routeSvg(c, here)+

      '<div class="stops">'+c.list.map(function(s, i){
        return '<div class="'+(s.got ? 'got' : (i === next ? 'next' : ''))+'"><em>'+(s.got ? '✓' : (i+1))+'</em>'+esc(s.loc && s.loc !== '미정' ? s.loc : s.id)+
          '<small>'+(s.got ? '스탬프 완료' : (i === next ? '다음 추천' : ''))+'</small></div>';

var cam = document.getElementById('cam'), video = document.getElementById('video'), cammsg = document.getElementById('cammsg');
var stream = null, detector = null, looping = false, canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
/* 확대: 카메라가 줌을 지원하면 실제 줌(hw), 아니면 화면 가운데를 잘라 키우는 디지털 줌 */
var zoomEl = document.getElementById('zoom'), zvEl = document.getElementById('zv'), zoombar = document.getElementById('zoombar');
var zoom = 1, hw = null, track = null, pinch = null;
function setZoom(z){
  var max = +zoomEl.max || 4;
  z = Math.max(1, Math.min(max, Math.round(z * 10) / 10));
  zoom = z; zoomEl.value = z; zvEl.textContent = z.toFixed(1) + '×';
  [].forEach.call(zoombar.querySelectorAll('[data-z]'), function(b){ b.className = (+b.getAttribute('data-z') === z) ? 'on' : ''; });
  if(hw && track){
    video.style.transform = '';
    track.applyConstraints({ advanced: [{ zoom: Math.max(hw.min, Math.min(hw.max, z)) }] })
      .catch(function(){ hw = null; video.style.transform = zoom > 1 ? 'scale(' + zoom + ')' : ''; });
  } else {
    video.style.transform = z > 1 ? 'scale(' + z + ')' : '';
  }
}
zoomEl.oninput = function(){ setZoom(+this.value); };
zoombar.onclick = function(e){ var z = e.target.getAttribute && e.target.getAttribute('data-z'); if(z) setZoom(+z); };

cam.addEventListener('touchstart', function(e){ if(e.touches.length === 2) pinch = { d: touchDist(e.touches), z: zoom }; }, { passive: true });
cam.addEventListener('touchmove', function(e){ if(pinch && e.touches.length === 2){ e.preventDefault(); setZoom(pinch.z * touchDist(e.touches) / pinch.d); } }, { passive: false });
cam.addEventListener('touchend', function(e){ if(e.touches.length < 2) pinch = null; });
function loadJsQR(cb){
  if(window.jsQR) return cb();
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';

}
function openCam(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('이 브라우저에서는 카메라를 쓸 수 없어요. 사파리나 크롬으로 열거나, 휴대폰 카메라 앱으로 QR을 찍어 주세요.');
    return;
  }
  cammsg.textContent = 'QR을 네모 안에 맞춰 주세요';
  cam.className = 'on';
  hw = null; track = null; zoomEl.max = 4; setZoom(1);
  if('BarcodeDetector' in window){ try{ detector = new BarcodeDetector({ formats: ['qr_code'] }); }catch(e){ detector = null; } }
  loadJsQR(function(){
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(function(s){
      stream = s; video.srcObject = s; video.play();
      track = s.getVideoTracks()[0] || null;
      try{
        var caps = track && track.getCapabilities ? track.getCapabilities() : null;
        if(caps && caps.zoom && caps.zoom.max > 1){ hw = caps.zoom; zoomEl.max = Math.max(2, Math.min(hw.max, 5)); }
      }catch(e){ hw = null; }
      setZoom(1);
      looping = true; requestAnimationFrame(tick);
    }).catch(function(){
      cammsg.textContent = '카메라 권한이 필요해요. 브라우저 설정에서 카메라를 허용하거나, 휴대폰 카메라 앱으로 QR을 찍어 주세요.';
    });

}
function closeCam(){
  looping = false;

}
document.getElementById('camclose').onclick = closeCam;
function found(text){
  var q = '';

  q = cleanQr(q);
  if(!q){ cammsg.textContent = '참여용 QR이 아니에요. 거점에 붙은 QR을 찍어 주세요.'; return false; }

    if(w && h){
      /* 디지털 줌이면 화면에 보이는 가운데 부분만 잘라서 인식 → 작은 QR도 더 선명하게 읽힘 */
      var f = digital ? zoom : 1, sw = w / f, sh = h / f, sx = (w - sw) / 2, sy = (h - sh) / 2;
      var k = Math.min(1, 800 / Math.max(sw, sh));
      canvas.width = Math.round(sw * k); canvas.height = Math.round(sh * k);
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      if(detector){ detector.detect(canvas).then(onCodes).catch(onFail); return; }
      if(window.jsQR){
        var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if(code && code.data && found(code.data)) return;
      }
    }
  }
  requestAnimationFrame(tick);
}
