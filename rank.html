<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실시간 순위 · 현황</title>
<style>
:root{--bg:#F3F5F9;--card:#FFF;--ink:#1E2329;--sub:#6B7480;--muted:#9AA3AF;--line:#E7EAF0;--blue:#3D8BFD;--blue-soft:#EAF2FF;--mint:#34C38F;--mint-soft:#E6F7F0;--yellow:#F5B83D;--yellow-soft:#FFF6E0;--slate-soft:#EEF1F5;--bad:#E5534B;--gold:#F5B83D;--silver:#AEB8C6;--bronze:#D49A6A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.01em}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;min-width:0}
.brand i{flex:none;width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar nav{display:flex;gap:6px;flex:none}
.bar nav a{background:var(--slate-soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px;margin:4px 2px 14px}
.hero h1{font-size:24px;margin:0;line-height:1.2}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--sub)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(52,195,143,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(52,195,143,0)}100%{box-shadow:0 0 0 0 rgba(52,195,143,0)}}
.seg{display:inline-flex;background:var(--slate-soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 16px;font:inherit;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--yellow-soft);color:#8A5A00}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--sub)}
@media(max-width:420px){.stat{padding:11px 10px}.stat b{font-size:18px}}
.cols{display:grid;gap:12px;align-items:start}
@media(min-width:820px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}}
.card{background:var(--card);border-radius:18px;padding:16px}
h2{font-size:16px;margin:0 0 2px}
.note{font-size:12.5px;color:var(--sub);margin:0 0 12px}
.team{display:grid;grid-template-columns:26px 74px minmax(0,1fr) 70px;gap:8px;align-items:center;padding:7px 0}
.team .no{font-weight:800;color:var(--muted);text-align:center}
.team b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:12px;background:var(--slate-soft);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--blue);border-radius:999px;transition:width .6s}
.team.lead .fill{background:var(--yellow)}.team.lead .no{color:#B07800}
.team em{font-style:normal;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;font-size:14.5px}
.team small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:12px}
.pod{border-radius:16px;padding:12px 8px 10px;text-align:center;background:var(--slate-soft);min-width:0}
.pod .m{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:14px}
.pod b{display:block;font-size:14px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod small{display:block;font-size:11.5px;color:var(--sub)}
.pod strong{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.pod.p1{background:var(--yellow-soft);padding-top:18px}.pod.p1 .m{background:var(--gold);width:36px;height:36px;font-size:16px}.pod.p1 strong{font-size:24px}
.pod.p2 .m{background:var(--silver)}.pod.p3 .m{background:var(--bronze)}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);font-size:14.5px}
.row .no{font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--muted);font-size:12px;margin-left:6px}
.row em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:14px}
.more{display:block;margin:10px auto 0;border:0;background:none;color:var(--blue);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.sec-t{font-size:18px;margin:22px 2px 10px}
.flow{display:grid;gap:12px;align-items:start}
@media(min-width:820px){.flow{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1px solid var(--line);margin-top:6px}
.chart .h{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%;position:relative}
.chart i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.chart small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin-top:26px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.peak{font-size:13px;color:var(--ink);background:var(--blue-soft);border-radius:10px;padding:7px 10px;margin-top:10px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv b{flex:none;font-variant-numeric:tabular-nums}
.kv small{color:var(--muted);font-weight:500}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.mini3 div{background:var(--card);border-radius:14px;padding:10px 12px}
.mini3 b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.mini3 span{font-size:11.5px;color:var(--sub)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;color:var(--sub)}
.go{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:11px 18px;font-size:14px}
.err{color:var(--bad);font-weight:700}
/* 불러오는 동안 자리 잡아 두기 */
.sk{background:linear-gradient(90deg,#E9EDF3 25%,#F3F5F9 50%,#E9EDF3 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
.stale{opacity:.65;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){.live i,.sk{animation:none}}
</style>
</head>
<body>
<header class="bar"><div class="brand"><i>Q</i><span id="ttl">QR 참여</span></div><nav><a href="home.html" id="portal">처음</a><a href="./" id="home">내 화면</a></nav></header>
<main class="wrap">
  <div class="hero"><h1>실시간 순위 · 현황</h1><span class="live" id="live"><i></i><span id="stamp">불러오는 중</span></span></div>
  <div class="seg" id="seg"><button data-v="all" class="on">전체 누적</button><button data-v="today">오늘</button></div>
  <div id="app">
    <div class="stats"><div class="stat sk" style="height:62px"></div><div class="stat sk" style="height:62px"></div><div class="stat sk" style="height:62px"></div></div>
    <div class="cols"><div class="card"><div class="sk" style="height:200px"></div></div><div class="card"><div class="sk" style="height:320px"></div></div></div>
  </div>
  <div class="foot"><span>같은 점수면 먼저 달성한 사람이 위예요 · 1분마다 자동 갱신</span><a class="go" id="golink" href="./">참가하러 가기</a></div>
</main>
<script src="config.js"></script>
<script>if(!new URLSearchParams(location.search).get('s')) history.replaceState(null,'',location.pathname+'?s=pilot');</script>
<script src="mode.js"></script>
<script>
var SRV = (new URLSearchParams(location.search).get('s') || 'pilot').replace(/[^a-z]/g,'');
if(!(window.QR_SERVERS||{})[SRV]) SRV = 'pilot';
var API_URL = window.QR_SERVERS[SRV].url, SQ = '?s=' + SRV;
var showAll = false, CK = 'qr-rank-cache-' + SRV, app = document.getElementById('app'), view = 'all', last = null, busy = false;
function nf(n){ return Number(n||0).toLocaleString('ko-KR'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function roundChip(d){
  var r = d.round; if(!d.hasTreasure || !r) return '';
  return '<span class="chip">'+(r.open ? '🌼 보물 '+r.round+'회차'+(r.next ? ' · 다음 변경 '+esc(r.next) : '') : (r.next ? '운영 전 · '+esc(r.next)+' 시작' : '운영 종료'))+'</span>';
}
function render(d, stale){
  last = d;
  if(d.title){ document.getElementById('ttl').textContent = d.title; document.title = d.title + ' 순위 · 현황'; }
  var v = view === 'today' && d.today ? d.today : d, h = '';
  var lead = v.teams[0] && v.teams[0].score > 0 ? v.teams[0].team : '-';
  h += '<div class="stats"><div class="stat"><b>'+v.players+'명</b><span>점수 얻은 사람</span></div><div class="stat"><b>'+v.total+'점</b><span>'+(view==='today'?'오늘':'전체')+' 쌓인 점수</span></div><div class="stat"><b>'+esc(lead)+'</b><span>1위 팀</span></div></div>';
  var max = Math.max(1, Math.max.apply(null, v.teams.map(function(t){ return t.score; })));
  h += '<div class="cols"><section class="card"><h2>팀 대항전 '+roundChip(d)+'</h2><p class="note">팀원 점수 합계'+(view==='today'?' · 오늘만':'')+'</p>'+
    v.teams.map(function(t,i){ return '<div class="team'+(i===0&&t.score>0?' lead':'')+'"><span class="no">'+(i+1)+'</span><b>'+esc(t.team)+'</b><div class="track" role="img" aria-label="'+esc(t.team)+' '+t.score+'점"><div class="fill" style="width:'+(t.score/max*100)+'%"></div></div><em>'+t.score+'점<small>'+t.act+'명 참여</small></em></div>'; }).join('')+'</section>';
  h += '<section class="card"><h2>개인 순위</h2><p class="note">상위 30명'+(view==='today'?' · 오늘 얻은 점수':'')+'</p>';
  var P = v.people;
  if(P.length){
    var pod = function(p, i){ return p ? '<div class="pod p'+(i+1)+'"><span class="m">'+(i+1)+'</span><b>'+esc(p.nick)+'</b><small>'+esc(p.team)+'</small><strong>'+p.hits+'점</strong></div>' : '<div></div>'; };
    h += '<div class="podium">'+pod(P[1],1)+pod(P[0],0)+pod(P[2],2)+'</div>';
    var lim = showAll ? P.length : Math.min(P.length, 10);
    h += P.slice(3, lim).map(function(p,i){ return '<div class="row"><span class="no">'+(i+4)+'</span><span>'+esc(p.nick)+'<small>'+esc(p.team)+'</small></span><em>'+p.hits+'점</em></div>'; }).join('');
    if(P.length > 10) h += '<button class="more" id="more">'+(showAll ? '10위까지만 보기' : '30위까지 모두 보기 ›')+'</button>';
  } else h += '<p class="empty">'+(view==='today'?'오늘은':'아직')+' 점수를 얻은 사람이 없어요.<br>첫 번째 주인공이 되어보세요.</p>';
  h += '</section></div>';
  h += statsHtml(d);
  app.innerHTML = h;
  var mb = document.getElementById('more'); if(mb) mb.onclick = function(){ showAll = !showAll; render(last, false); };
  app.className = stale ? 'stale' : '';
  document.getElementById('stamp').textContent = (stale ? '지난 기록 · 새로 불러오는 중' : '마지막 갱신 '+String(d.stamp||'').slice(11,16));
}
/* 참여 현황: 거점 위치·거점별 수치 없이 전체 흐름만 (거점 지도는 운영자 관제에서) */
function statsHtml(d){
  var st = d.stats; if(!st || !st.dates || !st.dates.length) return '';
  var h = '<h2 class="sec-t">참여 현황</h2>';
  h += '<div class="mini3"><div><b>'+nf(st.scans)+'</b><span>현장 QR 스캔</span></div><div><b>'+nf(st.people)+'</b><span>QR을 찍은 사람</span></div><div><b>'+nf(st.moves)+'</b><span>거점 사이 이동</span></div></div>';
  var hrs = []; for(var x = st.open; x < st.close; x++) hrs.push(x);
  var groups;
  if(view === 'today') groups = st.hours[d.date] ? [{ name: '오늘', dates: [d.date] }] : [];
  else if(st.dates.length > 4){
    var wk = st.dates.filter(function(x){ var w = new Date(x+'T00:00:00Z').getUTCDay(); return w === 0 || w === 6; }), wd = st.dates.filter(function(x){ return wk.indexOf(x) < 0; });
    groups = [{ name:'평일 하루 평균', dates: wd }, { name:'주말 하루 평균', dates: wk }].filter(function(g){ return g.dates.length; });
  } else groups = st.dates.map(function(x){ return { name: x.slice(5).replace('-', '.'), dates: [x] }; });
  var gv = function(g, hr){ var t = 0; g.dates.forEach(function(x){ t += ((st.hours[x] || [])[hr] || 0); }); return Math.round(t / g.dates.length); };
  var mx = 1, peak = null; groups.forEach(function(g){ hrs.forEach(function(hr){ var y = gv(g, hr); if(y > mx){ mx = y; peak = { g: g.name, h: hr, y: y }; } }); });
  var col = ['#3D8BFD', '#F5B83D', '#34C38F', '#9B7BEA'];
  h += '<div class="flow"><section class="card"><h2>시간대별 QR 스캔</h2><p class="note">'+(view === 'today' ? '오늘' : (st.dates.length > 4 ? '평일·주말 하루 평균' : '날짜별'))+' · 몇 시에 사람이 많이 참여했는지</p>';
  if(groups.length){
    h += '<div class="chart">'+hrs.map(function(hr){ return '<div class="h">'+groups.map(function(g, i){ var y = gv(g, hr); return '<i title="'+esc(g.name)+' '+hr+'시 '+y+'건" style="height:'+(y/mx*100)+'%;background:'+col[i%4]+'"></i>'; }).join('')+'<small>'+hr+'</small></div>'; }).join('')+'</div>';
    h += '<div class="lg">'+groups.map(function(g, i){ return '<span><i style="background:'+col[i%4]+'"></i>'+esc(g.name)+'</span>'; }).join('')+'</div>';
    if(peak) h += '<div class="peak">⏰ 가장 붐빈 때: '+esc(peak.g)+' '+peak.h+'시대 (약 '+nf(peak.y)+'건)</div>';
  } else h += '<p class="empty">오늘은 아직 기록이 없어요.</p>';
  h += '</section>';
  var m = '';
  (st.course || []).forEach(function(c){ m += '<div class="kv"><span>🗺️ '+esc(c.name)+' 완주율</span><b>'+(c.starters ? Math.round(c.done/c.starters*100)+'% <small>('+nf(c.done)+'/'+nf(c.starters)+'명)</small>' : '-')+'</b></div>'; });
  (st.quiz || []).forEach(function(z){ var n = z.ok + z.ng; m += '<div class="kv"><span>❓ '+esc(z.q)+'</span><b>'+(n ? Math.round(z.ok/n*100)+'% <small>정답</small>' : '-')+'</b></div>'; });
  h += '<section class="card"><h2>프로그램 참여 결과</h2><p class="note">'+(view === 'today' ? '전체 기간 기준' : '코스 완주율 · 퀴즈 정답률')+'</p>'+(m || '<p class="empty">퀴즈·코스 기록이 없어요.</p>')+'</section></div>';
  return h;
}
function load(){
  if(busy) return; busy = true;
  var ctl = window.AbortController ? new AbortController() : null, t = setTimeout(function(){ if(ctl) ctl.abort(); }, 20000);
  fetch(API_URL + '?api=board&a=%5B%5D&_=' + Date.now(), ctl ? { redirect:'follow', signal: ctl.signal } : { redirect:'follow' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.error) throw new Error(d.error);
      render(d, false);
      try{ localStorage.setItem(CK, JSON.stringify(d)); }catch(e){}
    })
    .catch(function(){
      if(!last) app.innerHTML = '<p class="empty err">순위를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>';
      else document.getElementById('stamp').textContent = '연결이 잠깐 끊겼어요 · 1분 뒤 다시 시도';
    })
    .then(function(){ clearTimeout(t); busy = false; });
}
document.getElementById('seg').onclick = function(e){
  var v = e.target.getAttribute && e.target.getAttribute('data-v'); if(!v) return;
  view = v; [].forEach.call(this.children, function(b){ b.className = b.getAttribute('data-v') === v ? 'on' : ''; });
  if(last) render(last, app.className === 'stale');
};
document.getElementById('golink').href = './' + SQ;
document.getElementById('home').href = './' + SQ;
document.getElementById('portal').href = 'home.html';
/* 지난번에 본 순위를 먼저 바로 보여 주고, 뒤에서 새로 불러옴 */
try{ var c = JSON.parse(localStorage.getItem(CK) || 'null'); if(c) render(c, true); }catch(e){}
load();
setInterval(function(){ if(!document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
</script>
</body>
</html>
