<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공개 현황</title>
<style>
:root{--bg:#F3F5F9;--card:#FFF;--ink:#1E2329;--sub:#6B7480;--muted:#9AA3AF;--line:#E7EAF0;--blue:#3D8BFD;--mint:#34C38F;--yellow:#F5B83D;--purple:#9B7BEA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14.5px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.top a{color:var(--sub);text-decoration:none;font-size:13.5px}
h1{font-size:22px;margin:4px 0 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,select{border:0;background:#E9EDF3;color:#4B5563;border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
select{background:var(--card);border:1px solid var(--line)}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);font-size:12.5px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:26px;font-weight:800;color:#3A4250}
.stat span{font-size:12.5px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.map{border-radius:14px;overflow:hidden;background:#FAFBFD;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--sub);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.qtag{display:inline-block;background:var(--ink);color:#fff;font-size:10.5px;border-radius:999px;padding:0 6px;margin-right:3px}
.rk{display:grid;grid-template-columns:44px 1fr 56px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.track{height:8px;background:#EEF1F5;border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--blue);border-radius:6px}
.chart{display:flex;align-items:flex-end;gap:4px;height:140px;border-bottom:1px solid var(--line)}
.chart .h{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%;position:relative}
.chart i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.chart small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.big{font-size:28px;font-weight:800}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.row:last-child{border-bottom:0}
.warn{background:#FFF6E0;border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.load{text-align:center;color:var(--muted);padding:60px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><a href="portal.html" id="back">← 포털</a><h1 id="ttl">공개 현황</h1></div><div class="seg" id="srvs"></div></div>
  <div id="app"><div class="load">집계를 불러오는 중이에요</div></div>
</div>
<script src="config.js"></script>
<script>
var S = window.QR_SERVERS || {}, SRV = (new URLSearchParams(location.search).get('s') || window.QR_DEFAULT || 'fest').replace(/[^a-z]/g,'');
if(!S[SRV]) SRV = 'pilot';
var app = document.getElementById('app'), D = null, f = { date:'', metric:'scans' }, plan = { src:'', w:100, h:56 };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function heat(k){ var a=[169,203,255], b=[31,107,235]; return 'rgb('+a.map(function(v,i){ return Math.round(v+(b[i]-v)*k); }).join(',')+')'; }
document.getElementById('srvs').innerHTML = Object.keys(S).map(function(k){ return '<button data-s="'+k+'" class="'+(k===SRV?'on':'')+'">'+esc(S[k].name)+'</button>'; }).join('');
document.getElementById('srvs').onclick = function(e){ var k = e.target.getAttribute('data-s'); if(k && k!==SRV) location.search = '?s='+k; };
document.getElementById('back').href = 'portal.html' + (SRV==='pilot' ? '?s=pilot' : '?s='+SRV);
function load(){
  if(String(S[SRV].url).indexOf('여기에') >= 0){ app.innerHTML = '<div class="card">config.js에 '+esc(S[SRV].name)+' 서버 주소가 아직 없어요.</div>'; return; }
  fetch(S[SRV].url + '?api=publicStats&a=%5B%5D&_=' + Date.now(), { redirect:'follow' }).then(function(r){ return r.json(); }).then(function(d){
    if(d.error) throw 0; D = d; document.getElementById('ttl').textContent = d.title + ' 공개 현황'; document.title = d.title + ' 공개 현황';
    if(d.plan){ var im = new Image(); im.onload = function(){ plan = { src:d.plan, w:im.naturalWidth, h:im.naturalHeight }; render(); }; im.onerror = function(){ render(); }; im.src = d.plan; } else render();
  }).catch(function(){ app.innerHTML = '<div class="card">집계를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</div>'; });
}
function vals(){
  var v = {};
  D.qrs.forEach(function(q){ v[q.id] = 0; });
  if(f.metric === 'visitors'){ if(!f.date) D.qrs.forEach(function(q){ v[q.id] = q.visitors; }); else D.visitors.forEach(function(x){ if(x.date===f.date) v[x.qr] = x.n; }); return v; }
  D.cells.forEach(function(c){ if(!f.date || c.date===f.date) v[c.qr] += c.scans; });
  return v;
}
function lines(){
  var m = {};
  D.transitions.forEach(function(t){ if(f.date && t.date!==f.date) return; var k = t.from<t.to ? t.from+'|'+t.to : t.to+'|'+t.from; m[k] = (m[k]||0)+t.n; });
  return Object.keys(m).map(function(k){ var p=k.split('|'); return {a:p[0], b:p[1], n:m[k]}; }).sort(function(x,y){ return y.n-x.n; }).slice(0,20);
}
function mapSvg(v){
  var H = 100*plan.h/plan.w, by = {}, pts = D.qrs.filter(function(q){ return q.x!=null && q.y!=null; });
  var arr = pts.map(function(q){ return v[q.id]||0; }), mx = Math.max.apply(null,[1].concat(arr)), mn = Math.min.apply(null, arr.length?arr:[0]);
  pts.forEach(function(q){ by[q.id] = q; });
  var s = '<svg viewBox="0 0 100 '+H.toFixed(2)+'" xmlns="http://www.w3.org/2000/svg">';
  if(plan.src) s += '<image href="'+esc(plan.src)+'" width="100" height="'+H.toFixed(2)+'" preserveAspectRatio="none"/>';
  var L = lines(), lm = Math.max.apply(null,[1].concat(L.map(function(l){ return l.n; })));
  L.forEach(function(l){ var a=by[l.a], b=by[l.b]; if(!a||!b) return; var k=l.n/lm;
    s += '<line x1="'+a.x+'" y1="'+(a.y*H/100)+'" x2="'+b.x+'" y2="'+(b.y*H/100)+'" stroke="#34C38F" stroke-linecap="round" stroke-opacity="'+(0.15+0.7*k).toFixed(2)+'" stroke-width="'+(0.2+2.2*k).toFixed(2)+'"/>'; });
  var tags = '';
  pts.map(function(q){ var x = v[q.id]||0, k = mx>mn ? (x-mn)/(mx-mn) : 1; return { q:q, v:x, k:k, r:1.3+2.7*k }; }).sort(function(a,b){ return b.r-a.r; }).forEach(function(p){
    var cy = p.q.y*H/100, fs = Math.min(2.3, Math.max(1.3, p.r*0.85));
    s += '<g><title>'+esc(p.q.id+' '+p.q.loc+' · '+p.v)+'</title><circle cx="'+p.q.x+'" cy="'+cy+'" r="'+p.r.toFixed(2)+'" fill="'+heat(p.k)+'" fill-opacity=".92" stroke="#fff" stroke-width=".3"/>'+
      '<text x="'+p.q.x+'" y="'+(cy+fs*0.36)+'" text-anchor="middle" font-size="'+fs.toFixed(2)+'" font-weight="800" fill="#fff">'+p.v+'</text></g>';
    var tw = 0.78*p.q.id.length+1.1, ty = cy-p.r-1.25;
    tags += '<rect x="'+(p.q.x-tw/2).toFixed(2)+'" y="'+(ty-0.95).toFixed(2)+'" width="'+tw.toFixed(2)+'" height="1.9" rx=".95" fill="#1E2329" fill-opacity=".85"/><text x="'+p.q.x+'" y="'+(ty+0.42).toFixed(2)+'" text-anchor="middle" font-size="1.2" font-weight="700" fill="#fff">'+esc(p.q.id)+'</text>';
  });
  return s + tags + '</svg>';
}
function render(){
  var d = D, t = d.totals, v = vals();
  var h = '';
  if(/시뮬레이션/.test(d.title)) h += '<div class="warn">이 화면의 수치는 <b>가상 데이터(시뮬레이션)</b>예요. 실제 운영 결과가 아니에요.</div>';
  h += '<div class="stats"><div class="stat"><b>'+t.scans.toLocaleString()+'</b><span>현장 스캔</span></div><div class="stat"><b>'+t.people.toLocaleString()+'</b><span>참여한 사람</span></div><div class="stat"><b>'+t.moves.toLocaleString()+'</b><span>거점 사이 이동</span></div><div class="stat"><b>'+d.dates.length+'일</b><span>기록된 날</span></div></div>';
  h += '<div class="card"><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">거점 이용 지도</h2><div style="display:flex;gap:6px">'+
    '<select id="fd"><option value="">전체 기간</option>'+d.dates.map(function(x){ return '<option'+(f.date===x?' selected':'')+'>'+x+'</option>'; }).join('')+'</select>'+
    '<select id="fm"><option value="scans"'+(f.metric==='scans'?' selected':'')+'>현장 스캔</option><option value="visitors"'+(f.metric==='visitors'?' selected':'')+'>방문자</option></select></div></div>'+
    '<div class="map">'+mapSvg(v)+'</div><div class="legend"><span><i style="background:var(--blue)"></i>원 안 숫자 = '+(f.metric==='scans'?'현장 스캔':'방문자')+'</span><span><b class="qtag">Q-01</b>= QR 번호</span><span><i style="background:var(--mint)"></i>이어서 이동한 횟수</span></div></div>';
  // 시간대
  var hrs = []; for(var x = d.open; x < d.close; x++) hrs.push(x);
  var groups = d.dates.map(function(x){ return { name:x, dates:[x] }; });
  if(d.dates.length > 4){ var wk = d.dates.filter(function(x){ var w = new Date(x+'T00:00:00Z').getUTCDay(); return w===0||w===6; }), wd = d.dates.filter(function(x){ return wk.indexOf(x)<0; });
    groups = [{name:'평일 평균', dates:wd},{name:'주말 평균', dates:wk}].filter(function(g){ return g.dates.length; }); }
  var hv = {}; d.cells.forEach(function(c){ hv[c.date+'|'+c.hour] = (hv[c.date+'|'+c.hour]||0)+c.scans; });
  var gv = function(g,hr){ var s=0; g.dates.forEach(function(x){ s += hv[x+'|'+hr]||0; }); return Math.round(s/g.dates.length); };
  var hm = 1; groups.forEach(function(g){ hrs.forEach(function(hr){ hm = Math.max(hm, gv(g,hr)); }); });
  var col = ['#3D8BFD','#34C38F','#9B7BEA','#F5B83D'];
  h += '<div class="grid"><div class="card"><h2>시간대별 스캔 <span class="sub">'+(d.dates.length>4?'하루 평균':'날짜별')+'</span></h2><div class="chart">'+hrs.map(function(hr){ return '<div class="h">'+groups.map(function(g,i){ var y=gv(g,hr); return '<i title="'+esc(g.name)+' '+hr+'시 '+y+'건" style="height:'+(y/hm*100)+'%;background:'+col[i%4]+'"></i>'; }).join('')+'<small>'+hr+'</small></div>'; }).join('')+'</div>'+
    '<div class="legend" style="margin-top:24px">'+groups.map(function(g,i){ return '<span><i style="background:'+col[i%4]+'"></i>'+esc(g.name)+'</span>'; }).join('')+'</div></div>';
  var list = d.qrs.slice().sort(function(a,b){ return (v[b.id]||0)-(v[a.id]||0); }), mx = Math.max.apply(null,[1].concat(list.map(function(q){ return v[q.id]||0; })));
  h += '<div class="card"><h2>많이 찾은 거점</h2>'+list.slice(0,8).map(function(q){ return '<div class="rk"><b>'+esc(q.id)+'</b><div><div class="track"><div class="fill" style="width:'+((v[q.id]||0)/mx*100)+'%"></div></div><span class="sub">'+esc(q.loc)+'</span></div><span style="text-align:right">'+(v[q.id]||0)+'</span></div>'; }).join('')+'</div>';
  // 모듈 성과
  var m = '';
  d.course.forEach(function(c){ m += '<div class="row"><span>'+esc(c.name)+' 완주율</span><b>'+(c.starters? Math.round(c.done/c.starters*100)+'% <span class="sub">('+c.done+'/'+c.starters+')</span>':'-')+'</b></div>'; });
  d.quiz.forEach(function(z){ var n=z.ok+z.ng; m += '<div class="row"><span>퀴즈 '+esc(z.q)+'</span><b>'+(n? Math.round(z.ok/n*100)+'%':'-')+'</b></div>'; });
  h += '<div class="card"><h2>모듈 성과</h2>'+(m || '<p class="sub">퀴즈·코스 기록이 없어요.</p>')+'</div>';
  h += '<div class="card"><h2>팀 대항전</h2>'+d.teams.map(function(x,i){ return '<div class="row"><span>'+(i+1)+'. '+esc(x.team)+' <span class="sub">'+x.act+'명</span></span><b>'+x.score+'점</b></div>'; }).join('')+'</div></div>';
  app.innerHTML = h;
  document.getElementById('fd').onchange = function(){ f.date = this.value; render(); };
  document.getElementById('fm').onchange = function(){ f.metric = this.value; render(); };
}
load();
</script>
</body>
</html>
